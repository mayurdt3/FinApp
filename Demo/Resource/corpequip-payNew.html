/* ---------- deterministic merchant data ---------- */
function genData(seed) {
  const r = mulberry(seed);
  const ri = (a, b) => a + Math.floor(r() * (b - a + 1));
  const cardPick = () => { const x = r(); return x < 0.5 ? 'VS' : x < 0.75 ? 'MC' : x < 0.93 ? 'AXP' : 'DISC'; };
  const out = { txns: [], batches: [], ach: [], chargebacks: [], uploads: [], statements: [], fees: {} };
  let bSeq = 441000, tSeq = 0, trace = 91000010000400;
  for (let d = DATA_START; d <= DATA_END; d = addDays(d, 1)) {
    const base = [120, 70, 75, 80, 90, 125, 135][dow(d)];
    const n = base + ri(-20, 20);
    const nb = r() < 0.18 ? 2 : 1;
    const closes = nb === 2 ? [ri(14 * 60, 15 * 60), ri(19 * 60, 21 * 60 + 30)] : [ri(19 * 60, 21 * 60 + 30)];
    const bs = closes.map((c, i) => ({ id: String(++bSeq), number: '980' + String(bSeq).padStart(8, '0'), closeDate: d, closeMin: c, deviceId: '80', depositDate: addDays(d, 1), amount: 0, count: 0, items: [] }));
    const dayTx = [];
    for (let i = 0; i < n; i++) {
      const sec = ri(7 * 3600, closes[nb - 1] * 60 - 300);
      dayTx.push({ sec: sec, action: 'Sale', card: cardPick(), amount: Math.max(300, Math.round((3 + 230 * Math.pow(r(), 2.3)) * 100)), last4: String(ri(0, 9999)).padStart(4, '0') });
    }
    if (r() < 0.25) { const k = ri(1, 2); for (let i = 0; i < k; i++) dayTx.push({ sec: ri(9 * 3600, closes[nb - 1] * 60 - 600), action: 'Refund', card: cardPick(), amount: ri(10, 60) * 100 + ri(0, 99), last4: String(ri(0, 9999)).padStart(4, '0') }); }
    dayTx.sort((a, b) => a.sec - b.sec);
    dayTx.forEach(t => {
      const b = bs.find(x => x.closeMin * 60 >= t.sec) || bs[bs.length - 1];
      const hh = String(Math.floor(t.sec / 3600)).padStart(2, '0'), mm = String(Math.floor(t.sec / 60) % 60).padStart(2, '0'), ss = String(t.sec % 60).padStart(2, '0');
      const tx = { id: 'T' + String(++tSeq).padStart(6, '0'), date: d, time: hh + ':' + mm + ':' + ss, card: t.card, cardNo: '******' + t.last4, last4: t.last4, action: t.action, amount: t.amount, batchId: b.id };
      out.txns.push(tx); b.items.push(tx); b.count++; b.amount += t.action === 'Refund' ? -t.amount : t.amount;
    });
    bs.forEach(b => {
      const cm = b.closeMin; b.closeTime = String(Math.floor(cm / 60)).padStart(2, '0') + ':' + String(cm % 60).padStart(2, '0') + ':' + String(ri(0, 59)).padStart(2, '0');
      out.batches.push(b);
      out.ach.push({ id: 'D' + (++trace), depositDate: b.depositDate, amount: b.amount, tranType: 'DEP', dpTy: '3', crdType: 'BTOT', tranCode: 'Checking Deposit', aba: '011000015', account: '****5143', trace: '0' + trace, batchId: b.id });
    });
    const up = { id: 'DailyUpload-' + d + '_01', fileDate: d, start: d + ' 20:30:' + String(ri(10, 59)).padStart(2, '0'), downloaded: addDays(d, 1), collections: nb, records: dayTx.length, success: dayTx.length, failed: 0 };
    up.end = d + ' 20:3' + ri(3, 8) + ':' + String(ri(10, 59)).padStart(2, '0');
    out.uploads.push(up);
  }
  // monthly fees, chargebacks, statements
  const months = fullMonths();
  months.forEach(m => {
    const mt = out.txns.filter(t => t.date.slice(0, 7) === m);
    const sales = mt.filter(t => t.action === 'Sale').reduce((a, t) => a + t.amount, 0);
    const fee = rhu(sales * 195, 10000) + 2500; out.fees[m] = fee;
    const next = addDays(m + '-28', 4).slice(0, 7) + '-01';
    out.ach.push({ id: 'D' + (++trace), depositDate: next, amount: -fee, tranType: 'DEB', dpTy: '3', crdType: 'MTOT', tranCode: 'Checking Debit', aba: '011000015', account: '****5143', trace: '0' + trace, batchId: '' });
    const k = ri(1, 2);
    for (let i = 0; i < k; i++) {
      const sale = mt.filter(t => t.action === 'Sale')[ri(0, 200)];
      let rec = addDays(sale.date, ri(8, 20)); if (rec.slice(0, 7) !== m) rec = m + '-28';
      out.chargebacks.push({ id: 'CB' + String(out.chargebacks.length + 1).padStart(4, '0'), received: rec, caseNo: '2026' + String(ri(100000, 999999)), card: sale.card, last4: sale.last4, origDate: sale.date, amount: sale.amount, action: 'Debit' });
      out.ach.push({ id: 'D' + (++trace), depositDate: addDays(rec, 1), amount: -sale.amount, tranType: 'DEB', dpTy: '3', crdType: 'CBK', tranCode: 'Chargeback Debit', aba: '011000015', account: '****5143', trace: '0' + trace, batchId: '' });
    }
  });
  months.forEach(m => {
    const submitted = out.batches.filter(b => b.closeDate.slice(0, 7) === m).reduce((a, b) => a + b.amount, 0);
    const adj = out.chargebacks.filter(c => c.received.slice(0, 7) === m).reduce((a, c) => a + c.amount, 0);
    const y = +m.slice(0, 4), mo = +m.slice(5, 7);
    out.statements.push({ id: m, name: MONTHS[mo - 1] + ' ' + y + ' Statement', year: y, month: mo, period: m + '-01', submitted: submitted, thirdParty: 0, adjustments: adj, fees: out.fees[m], funded: submitted - 0 - adj - out.fees[m] });
  });
  out.ach.sort((a, b) => a.depositDate < b.depositDate ? -1 : a.depositDate > b.depositDate ? 1 : 0);
  out.batchById = {}; out.batches.forEach(b => { out.batchById[b.id] = b; });
  return out;
}

/* ---------- period filters ---------- */
function period(q) {
  const mode = q.mode || 'month';
  if (mode === 'day') { const d = q.date || DATA_END; return { mode: mode, from: d, to: d, label: us(d) }; }
  if (mode === 'range') { const f = q.from || addDays(DATA_END, -13), t = q.to || DATA_END; return { mode: mode, from: f, to: t, label: 'From ' + us(f) + ' To ' + us(t) }; }
  if (mode === 'year') { const y = q.year || DATA_END.slice(0, 4); return { mode: mode, from: y + '-01-01', to: y + '-12-31', label: 'Year ' + y }; }
  const y = +(q.year || DATA_END.slice(0, 4)), m = +(q.month || +DATA_END.slice(5, 7));
  const from = y + '-' + String(m).padStart(2, '0') + '-01';
  return { mode: 'month', from: from, to: addDays(addDays(from, 32).slice(0, 7) + '-01', -1), label: MONTHS[m - 1] + ' ' + y };
}
// end date is inclusive in every filter mode (By Day = a one-day period)
function inPeriod(ds, p) { return ds >= p.from && ((bug('BUG-02') && p.mode === 'range') ? ds < p.to : ds <= p.to); }
function fullMonths() { const out = []; for (let m = DATA_START.slice(0, 7); m < DATA_END.slice(0, 7); m = addDays(m + '-28', 4).slice(0, 7)) out.push(m); return out; }

/* ---------- reports (single source of truth: D) ---------- */
function rptTotals(q) {
  const p = period(q); const by = {};
  ['VS', 'MC', 'AXP', 'DISC'].forEach(c => { by[c] = { card: c, salesItems: 0, sales: 0, refundItems: 0, refunds: 0 }; });
  D.txns.forEach(t => { if (!inPeriod(t.date, p)) return; const b = by[t.card]; if (t.action === 'Sale') { b.salesItems++; b.sales += t.amount; } else { b.refundItems++; b.refunds += t.amount; } });
  const rows = Object.keys(by).map(k => by[k]).filter(r => r.salesItems + r.refundItems > 0);
  rows.forEach(r => { r.avg = r.salesItems ? rhu(r.sales, r.salesItems) : 0; r.total = bug('BUG-01') ? r.sales : r.sales - r.refunds; });
  return { p: p, rows: rows };
}
function rptBatches(q) {
  const p = period(q); const key = q.dateType === 'funded' ? 'depositDate' : 'closeDate';
  let rows = D.batches.filter(b => inPeriod(b[key], p));
  if (bug('BUG-13')) rows = rows.map(b => Object.assign({}, b, { count: b.items.filter(t => t.action === 'Sale').length }));
  return { p: p, rows: rows };
}
// net amount of a list of transactions: sales add, refunds subtract
function searchNet(rows) { return rows.reduce((a, t) => a + (t.action === 'Refund' && !bug('BUG-14') ? -t.amount : t.amount), 0); }
function rptSearch(q) {
  const p = period(q);
  return { p: p, rows: D.txns.filter(t => inPeriod(t.date, p) && (!q.type || t.action === q.type) && (!q.last4 || t.last4 === q.last4) && (!q.amount || plain(t.amount) === Number(q.amount).toFixed(2))) };
}
function rptAch(q) {
  const p = period(q);
  return { p: p, rows: D.ach.filter(a => inPeriod(a.depositDate, p) && (!q.tranCode || a.tranCode === q.tranCode)) };
}
function achIncluded(achId) {
  const a = D.ach.find(x => x.id === achId); if (!a || !a.batchId) return { ach: a, rows: [] };
  const by = {};
  D.batchById[a.batchId].items.forEach(t => { const r = by[t.card] = by[t.card] || { card: t.card, count: 0, total: 0 }; r.count++; r.total += t.action === 'Refund' ? -t.amount : t.amount; });
  let rows = Object.keys(by).map(k => by[k]);
  if (bug('BUG-08')) rows = rows.filter(x => x.card !== 'DISC');
  return { ach: a, rows: rows };
}
function rptUploads(q) {
  const p = period(q); const key = q.uploadType === 'downloaded' ? 'downloaded' : 'fileDate';
  return { p: p, rows: D.uploads.filter(u => inPeriod(u[key], p)) };
}
function rptChargebacks(q) {
  const p = period(q);
  return { p: p, rows: D.chargebacks.filter(c => inPeriod(c.received, p) && (!q.last4 || c.last4 === q.last4)) };
}
function rptDiscount(q) {
  const p = period(q); const rows = []; let day = null, acc = null;
  const bs = D.batches.filter(b => inPeriod(b.closeDate, p));
  bs.forEach((b, i) => {
    if (!acc || acc.date !== b.closeDate) acc = { date: b.closeDate, items: 0, amount: 0 };
    acc.items += b.count; acc.amount = bug('BUG-07') ? b.amount : acc.amount + b.amount;
    rows.push({ key: b.number, number: b.number, date: b.closeDate, items: b.count, discount: 0, amount: b.amount, funded: b.amount, total: false });
    const nxt = bs[i + 1];
    if (!nxt || nxt.closeDate !== b.closeDate) rows.push({ key: 'DT-' + b.closeDate, number: 'DAILY TOTAL', date: b.closeDate, items: acc.items, discount: 0, amount: acc.amount, funded: acc.amount, total: true });
  });
  return { p: p, rows: rows };
}
function rptStatements(q) {
  // a statement covers a calendar month; it matches when its month overlaps the selected period
  const p = period(q);
  return { p: p, rows: D.statements.filter(s => { const end = addDays(addDays(s.period, 32).slice(0, 7) + '-01', -1); return s.period <= p.to && end >= p.from; }) };
}

/* ---------- dashboard metrics ---------- */
function overview(sel) {
  const today = S.today; let p;
  if (sel === 'all') p = { from: '0000', to: '9999' };
  else if (sel === 'month') p = { from: today.slice(0, 7) + '-01', to: today };
  else p = { from: sel + '-01-01', to: sel + '-12-31' };
  const tx = D.txns.filter(t => t.date >= p.from && t.date <= p.to);
  const sales = tx.filter(t => t.action === 'Sale');
  const batchTotal = D.batches.filter(b => b.closeDate >= p.from && b.closeDate <= p.to).reduce((a, b) => a + b.amount, 0);
  const counts = [0, 0, 0, 0, 0, 0, 0]; tx.forEach(t => { counts[dow(t.date)]++; });
  let best = -1; counts.forEach((c, i) => { if (c > 0 && (best < 0 || c > counts[best])) best = i; });
  if (best >= 0 && bug('BUG-06')) best = (best + 1) % 7;
  return {
    batchTotal: batchTotal, count: tx.length,
    highest: sales.length ? Math.max.apply(null, sales.map(t => t.amount)) : 0,
    lowest: sales.length ? Math.min.apply(null, sales.map(t => t.amount)) : 0,
    avg: sales.length ? rhu(sales.reduce((a, t) => a + t.amount, 0), sales.length) : 0,
    busiest: best >= 0 ? DAYS[best] : '-',
    chargebacks: D.chargebacks.filter(c => c.received >= p.from && c.received <= p.to).reduce((a, c) => a + c.amount, 0)
  };
}
function trend15() {
  const days = []; for (let i = 15; i >= 1; i--) days.push(addDays(S.today, -i));
  const per = days.map(d => { const tx = D.txns.filter(t => t.date === d); const s = tx.filter(t => t.action === 'Sale'); const rf = tx.filter(t => t.action === 'Refund');
    return { d: d, count: tx.length, sales: s.reduce((a, t) => a + t.amount, 0), avg: s.length ? rhu(s.reduce((a, t) => a + t.amount, 0), s.length) : 0, refunds: rf.reduce((a, t) => a + t.amount, 0) }; });
  const has = per.some(x => x.count > 0);
  const avg = k => rhu(per.reduce((a, x) => a + x[k], 0), 15);

/* ---------- reconciliation ---------- */
function runRecon() {
  const sum = (a, f) => a.reduce((x, y) => x + f(y), 0);
  const checks = [];
  const add = (id, name, exp, act, off) => checks.push({ id: id, name: name, expected: exp, actual: act, variance: act - exp, offending: off || [], status: exp === act && !(off && off.length) ? 'PASS' : 'FAIL' });
  const months = fullMonths().concat([DATA_END.slice(0, 7)]);
  const off1 = []; let e1 = 0, a1 = 0;
  months.forEach(m => { const q = { mode: 'month', year: m.slice(0, 4), month: m.slice(5) }; const t = sum(rptTotals(q).rows, r => r.total), b = sum(rptBatches(q).rows, r => r.amount); e1 += b; a1 += t; if (t !== b) off1.push(m); });
  add('R1', 'Totals Summary total submitted = Σ settled batch amounts (per month)', e1, a1, off1);
  add('R2', 'Σ settled batch amounts = Σ ACH batch deposits (BTOT)', sum(D.batches, b => b.amount), sum(D.ach.filter(a => a.crdType === 'BTOT'), a => a.amount));
  const allMonths = fullMonths().concat([DATA_END.slice(0, 7)]); const mq = m => ({ mode: 'month', year: m.slice(0, 4), month: String(+m.slice(5)) });
  const trueCount = sum(D.batches, b => b.count); const off3 = []; let a3 = trueCount;
  allMonths.forEach(m => { const bc = sum(rptBatches(mq(m)).rows, b => b.count), sc = rptSearch(mq(m)).rows.length; if (bc !== sc) { off3.push(m); if (a3 === trueCount) a3 = trueCount - sc + bc; } });
  const rangeCount = rptSearch({ mode: 'range', from: DATA_START, to: DATA_END }).rows.length; if (rangeCount !== trueCount) { off3.push('range'); if (a3 === trueCount) a3 = rangeCount; }
  add('R3', 'Settled Batches trans count = Search Transactions row count (per month and full range)', trueCount, a3, off3);
  const lm = fullMonths().slice(-1)[0]; const dq = { mode: 'month', year: lm.slice(0, 4), month: String(+lm.slice(5)) }; const dr = rptDiscount(dq).rows;
  const off4 = dr.filter(r => r.total).filter(r => r.amount !== sum(D.batches.filter(b => b.closeDate === r.date), b => b.amount)).map(r => r.date);
  add('R4', 'Daily Discount Calculator daily totals = Σ batch amounts per day', sum(rptBatches(dq).rows, b => b.amount), sum(dr.filter(r => r.total), r => r.amount), off4);
  const off5 = D.ach.filter(a => a.crdType === 'BTOT').filter(a => sum(achIncluded(a.id).rows, r => r.total) !== a.amount).map(a => a.id);
  add('R5', 'ACH "What is included" card-type totals = deposit amount', 0, off5.length, off5);
  const off6 = []; let e6 = 0, a6 = 0;
  YEARS.forEach(y => { const o = overview(y).batchTotal, t = sum(rptTotals({ mode: 'year', year: y }).rows, r => r.total); e6 += t; a6 += o; if (o !== t) off6.push(y); });
  add('R6', 'Business Overview batch total = Totals Summary total (per year)', e6, a6, off6);
  const off7 = D.statements.filter(s => s.funded !== s.submitted - s.thirdParty - s.adjustments - s.fees || s.adjustments !== sum(D.chargebacks.filter(c => c.received.slice(0, 7) === s.id), c => c.amount)).map(s => s.id);
  add('R7', 'Statement funded = submitted − third party − chargebacks − fees', 0, off7.length, off7);
  const subs = S.apps.filter(a => a.order);
  const off8 = subs.filter(a => sum(a.order.lines, l => l.price * l.qty) + a.order.ship !== a.order.total).map(a => a.id);
  add('R8', 'Submitted equipment orders: Σ lines + shipping = order total', 0, off8.length, off8);
  const off9 = []; let e9 = 0, a9 = 0;
  allMonths.forEach(m => { const b = sum(rptBatches(mq(m)).rows, x => x.amount), t = searchNet(rptSearch(mq(m)).rows); e9 += b; a9 += t; if (b !== t) off9.push(m); });
  add('R9', 'Search Transactions net total = Σ settled batch amounts (per month)', e9, a9, off9);
  return { ranAt: S.today, activeBugs: S.bugs.slice(), allPassed: checks.every(c => c.status === 'PASS'), passed: checks.filter(c => c.status === 'PASS').length, failed: checks.filter(c => c.status === 'FAIL').length, checks: checks };
}

function parseHash() {

  if (st.sort) {

/* ---------- reconciliation report (cross-report consistency) ---------- */
const RECON_MONEY = ['R1', 'R2', 'R4', 'R6', 'R9'];
function reconLink(id, chk) {
  if (/^\d{4}-\d{2}$/.test(id) && (chk === 'R3' || chk === 'R9')) return '<a href="#/reports/' + (chk === 'R3' ? 'settled-batches' : 'search-transactions') + '?mode=month&month=' + (+id.slice(5)) + '&year=' + id.slice(0, 4) + '">' + id + '</a>';
  if (id === 'range') return '<a href="#/reports/search-transactions?mode=range&from=' + DATA_START + '&to=' + DATA_END + '">full date range</a>';
  if (/^\d{4}-\d{2}$/.test(id) && chk === 'R7') return '<a href="#/reports/merchant-statements/' + id + '">' + id + '</a>';
  if (/^\d{4}-\d{2}$/.test(id)) return '<a href="#/reports/totals-summary?mode=month&month=' + (+id.slice(5)) + '&year=' + id.slice(0, 4) + '">' + id + '</a>';
  if (/^\d{4}-\d{2}-\d{2}$/.test(id)) return '<a href="#/reports/discount-calculator?mode=day&date=' + id + '">' + us(id) + '</a>';
  if (/^\d{4}$/.test(id)) return '<a href="#/reports/totals-summary?mode=year&year=' + id + '">' + id + '</a>';
  if (/^D\d+$/.test(id)) return '<a href="#/reports/ach-deposit/included/' + id + '">' + id + '</a>';
  if (/^APP-/.test(id)) return '<a href="#/iso/' + id + '/confirmation">' + id + '</a>';
  return esc(id);
}
const RECON_WHERE = { R1: 'Totals Summary vs Settled Batches', R2: 'Settled Batches vs ACH Deposit', R3: 'Settled Batches vs Search Transactions (counts)', R4: 'Daily Discount Calculator vs Settled Batches',
  R5: 'ACH Deposit vs What is Included', R6: 'Dashboard Business Overview vs Totals Summary', R7: 'Merchant Statements vs Chargebacks', R8: 'Partner Hub orders', R9: 'Search Transactions vs Settled Batches (amounts)' };

/* ---------- reconciliation "Details": which filters/dates to check ---------- */
function monthLabel(m) { return MONTHS[+m.slice(5) - 1].slice(0, 3) + ' ' + m.slice(0, 4); }
function mLink(rep, m) { return { t: monthLabel(m), h: '#/reports/' + rep + '?mode=month&month=' + (+m.slice(5)) + '&year=' + m.slice(0, 4) }; }
function reconDetails(c) {
  const full = us(DATA_START) + ' – ' + us(DATA_END); const months = fullMonths().concat([DATA_END.slice(0, 7)]);
  const span = monthLabel(months[0]) + ' – ' + monthLabel(months[months.length - 1]);
  const lm = fullMonths().slice(-1)[0];
  let pre, items = [];
  const off = c.offending;
  switch (c.id) {
    case 'R1': pre = off.length ? 'Filter Totals Summary and Settled Batches By Month:' : 'Checked By Month, ' + span + ' (Totals Summary vs Settled Batches).';
      items = off.map(m => mLink('totals-summary', m)); break;
    case 'R2': pre = 'Checked By Date Range ' + full + ' (Settled Batches vs ACH Deposit, Checking Deposit rows).'; break;
    case 'R3': pre = off.length ? 'Filter Settled Batches and Search Transactions:' : 'Checked By Month, ' + span + ', and By Date Range ' + full + '.';
      items = off.map(m => m === 'range' ? { t: 'By Date Range ' + full, h: '#/reports/search-transactions?mode=range&from=' + DATA_START + '&to=' + DATA_END } : mLink('settled-batches', m)); break;
    case 'R4': pre = off.length ? 'Filter Daily Discount Calculator By Day:' : 'Checked By Month, ' + monthLabel(lm) + ' (DAILY TOTAL rows vs Settled Batches).';
      items = off.map(d => ({ t: us(d), h: '#/reports/discount-calculator?mode=day&date=' + d })); break;
    case 'R5': pre = off.length ? 'Filter ACH Deposit By Day and open "What is included" for:' : 'Checked every Checking Deposit, ' + full + '.';
      items = off.map(id => { const a = D.ach.find(x => x.id === id); return { t: us(a.depositDate) + ' (' + id + ')', h: '#/reports/ach-deposit/included/' + id }; }); break;
    case 'R6': pre = off.length ? 'Compare Dashboard → Business Overview with Totals Summary By Year:' : 'Checked By Year ' + YEARS.join(', ') + ' (Business Overview vs Totals Summary).';
      items = off.map(y => ({ t: 'Year ' + y, h: '#/reports/totals-summary?mode=year&year=' + y })); break;
    case 'R7': pre = off.length ? 'Open these statements and compare with Chargebacks By Month:' : 'Checked statements ' + monthLabel(fullMonths()[0]) + ' – ' + monthLabel(lm) + ' against Chargebacks By Month.';
      items = off.map(m => ({ t: monthLabel(m), h: '#/reports/merchant-statements/' + m })); break;
    case 'R8': pre = off.length ? 'Open the review/confirmation for:' : 'Checked ' + S.apps.filter(a => a.order).length + ' submitted equipment order(s).';
      items = off.map(id => ({ t: id, h: '#/iso/' + id + '/confirmation' })); break;
    case 'R9': pre = off.length ? 'Filter Search Transactions and Settled Batches By Month:' : 'Checked By Month, ' + span + ' (Search Transactions vs Settled Batches).';
      items = off.map(m => mLink('search-transactions', m)); break;
  }
  const shown = items.slice(0, 8);
  return { text: pre + (items.length ? ' ' + items.map(i => i.t).join(', ') : ''),
    html: esc(pre) + (shown.length ? ' ' + shown.map(i => '<a href="' + i.h + '">' + esc(i.t) + '</a>').join(', ') + (items.length > 8 ? ' … +' + (items.length - 8) : '') : '') };
}

  else { S = null; resetAll(seed == null ? DEFAULT_SEED : seed); if (st && st.bugs && !sp.has('bugs')) S.bugs = st.bugs; }
  if (sp.has('bugs')) S.bugs = parseBugs(sp.get('bugs'));
  if (/^\d{4}-\d{2}-\d{2}$/.test(sp.get('today') || '')) S.today = sp.get('today');
  saveState();
  document.addEventListener('click', onClick);
  document.addEventListener('change', onChange);
  document.addEventListener('submit', onSubmit);
  window.addEventListener('hashchange', () => { UI.menu = false; UI.banner = null; UI.reviewError = ''; UI.modal = null; UI.isoSel = null; render(); window.scrollTo(0, 0); });
  if (!location.hash) location.replace('#/dashboard');
  render();
  document.body.setAttribute('data-app-ready', 'true');
}
document.addEventListener('DOMContentLoaded', boot);

})();
</script>
